# /etc/nginx/conf.d/moa.conf
#
# 사내 공개용 최소 구성 — TLS 종단 + 앱으로 전달.
# 고객사 납품의 DMZ 구성(경로 화이트리스트 등)은 이것과 다르다. moa-mobile/doc/02 참고.

upstream moa_app {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name moa.example.co.kr;
    # 평문으로 들어오면 세션 쿠키(secure)가 실리지 않아 로그인이 안 된다. 바로 올려 보낸다.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name moa.example.co.kr;

    ssl_certificate     /etc/nginx/ssl/moa.crt;
    ssl_certificate_key /etc/nginx/ssl/moa.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 위키 첨부가 20MB 까지다. 기본값 1MB 로 두면 413 으로 죽는다.
    client_max_body_size 25m;

    location / {
        proxy_pass http://moa_app;
        proxy_http_version 1.1;

        # ⚠️ 덧붙이기($proxy_add_x_forwarded_for)가 아니라 **덮어쓰기**다.
        # 덧붙이면 클라이언트가 보낸 값이 체인 앞에 남는다. 앱은 MOA_TRUSTED_PROXY_COUNT=1 로
        # 체인 뒤에서 1번째를 보므로 어느 쪽이든 안전하지만, 덮어쓰는 편이 로그가 깨끗하다.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";

        # 솔루션 로그 조회가 SSH 로 최대 60초 걸린다. nginx 기본이 딱 60초라 아슬아슬하게 502 가 난다.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
