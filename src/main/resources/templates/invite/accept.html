<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 계정 등록')}"></head>
<body>
<main class="workspace login-workspace">
  <section class="panel login-panel">
    <p class="eyebrow">초대 수락</p>
    <h1>계정 등록</h1>
    <p class="subcopy">초대받은 이메일로 계정을 만듭니다. 아이디는 이메일이며, 비밀번호와 연락처만 입력하면 됩니다.</p>

    <form method="post" th:action="@{'/invite/' + ${token}}">
      <p th:if="${error != null}" class="subcopy t-bad" th:text="${error}">오류</p>

      <label>이메일 (아이디)</label>
      <input type="email" th:value="${email}" readonly>

      <label for="name">이름</label>
      <input id="name" name="name" th:value="${name}" required autocomplete="name">

      <label for="phone">전화번호</label>
      <input id="phone" name="phone" required autocomplete="tel" placeholder="010-1234-5678">

      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" placeholder="8자 이상">

      <label for="passwordConfirm">비밀번호 확인</label>
      <input id="passwordConfirm" name="passwordConfirm" type="password" required autocomplete="new-password">

      <button class="button primary" type="submit">가입 완료</button>
    </form>
  </section>
</main>
</body>
</html>
