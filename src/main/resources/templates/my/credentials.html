<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 내 크리덴셜</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('my-credentials')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">개인 / 내 크리덴셜</p>
      <h1>내 크리덴셜</h1>
      <p class="subcopy">나에게 공유된 자격증명(공유기·프린터 등)을 확인합니다. '확인'을 누르면 잠깐 표시되며, 열람은 기록됩니다.</p>
    </div>
  </header>

  <p th:if="${revealError != null}" class="subcopy" style="color:#c0392b" th:text="${revealError}">오류</p>

  <section class="panel">
    <p th:if="${#lists.isEmpty(credentials)}" class="subcopy">공유된 자격증명이 없습니다. 필요하면 관리자에게 요청하세요.</p>
    <div th:unless="${#lists.isEmpty(credentials)}" class="data-table">
      <div class="table-row table-head"><span>이름</span><span>계정</span><span>비밀</span><span>설정법</span></div>
      <div class="table-row" th:each="c : ${credentials}">
        <strong th:text="${c.name}">이름</strong>
        <span th:text="${revealedId == c.id} ? ${revealedUsername} : ${c.username}">계정</span>
        <span>
          <code th:if="${revealedId == c.id}" th:text="${revealedSecret}" style="background:#fff3cd;padding:.15rem .4rem;border-radius:4px">비밀</code>
          <form th:unless="${revealedId == c.id}" method="post" th:action="@{'/my/credentials/' + ${c.id} + '/reveal'}" style="display:inline">
            <button class="button" type="submit">확인</button>
          </form>
        </span>
        <span>
          <a th:if="${c.wikiSpaceId != null}" th:href="@{/wiki}" th:text="${spaceNames.get(c.wikiSpaceId)} ?: '위키'">설정법</a>
          <span th:if="${c.wikiSpaceId == null}" class="subcopy">—</span>
        </span>
      </div>
    </div>
    <p class="subcopy" style="margin-top:.5rem">표시된 비밀은 화면을 벗어나면 사라집니다. 타인에게 노출하지 마세요.</p>
  </section>
</main></div>
</body>
</html>
