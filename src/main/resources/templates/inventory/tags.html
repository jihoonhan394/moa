<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 관리번호')}"></head>
<body>
<!--
  관리번호(= QR 스티커 코드) 발급. 자산 대장의 "관리번호"와 폰이 찍는 코드는 같은 것이다.
  따로 두면 한 장비에 식별자가 둘 생기고, 현장에서 "이 번호로 찾아 주세요"가 통하지 않는다.
-->
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${page})}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">자산 / 관리번호</p>
      <h1>관리번호 발급</h1>
      <p class="subcopy">
        스티커로 인쇄해 자산에 붙입니다. <b>붙이기 전에 미리 발급</b>해 두고, 현장에서 폰으로 찍어
        그 자리에서 자산을 등록합니다. 번호는 자산 대장의 관리번호와 같은 값입니다.
      </p>
    </div>
    <a class="button" th:href="@{/inventory}">← 자산 목록</a>
  </header>

  <section class="panel">
    <div class="panel-head"><h2>새로 발급</h2></div>
    <form method="post" th:action="@{/inventory/tags}" class="form-panel">
      <label for="count">장수</label>
      <input type="number" id="count" name="count" value="20" min="1" max="500" required>
      <p class="subcopy">한 번에 1~500장. 넉넉히 발급해 두고 쓰는 편이 현장에서 편합니다.</p>
      <button class="button primary" type="submit">발급</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>붙이지 않은 번호</h2>
      <span class="pill" th:text="${#lists.size(tags)} + '장'">0장</span>
    </div>
    <p class="subcopy" th:if="${#lists.isEmpty(tags)}">발급된 번호가 없습니다.</p>
    <div th:unless="${#lists.isEmpty(tags)}" class="tag-sheet">
      <span class="tag-chip" th:each="tag : ${tags}" th:text="${tag.code}">MOA-0000-0000</span>
    </div>
  </section>
</main></div>
<style>
  /* 인쇄해서 자르기 좋게 격자로 늘어놓는다. */
  .tag-sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
  .tag-chip {
    padding: 12px 10px; border: 1px dashed var(--line); border-radius: 10px;
    font-family: ui-monospace, Consolas, monospace; font-size: 1rem; font-weight: 700;
    letter-spacing: .5px; text-align: center;
  }
  @media print {
    .sidebar, .topbar .button, .form-panel { display: none; }
    .tag-chip { border-style: solid; }
  }
</style>
</body>
</html>
