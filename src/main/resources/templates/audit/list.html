<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 감사 로그</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('audit')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">보안 및 감사 / 감사 로그</p>
      <h1>감사 로그</h1>
      <p class="subcopy">그룹·권한·사용자 변경과 웹 자산 열람 등 관리 행위 이력입니다. (조회 전용)</p>
    </div>
  </header>

  <nav th:replace="~{fragments/subnav :: audit('audit')}"></nav>

  <!--
    어제 요약. 감사 로그의 실제 문제는 "쌓이기만 하고 아무도 읽지 않는다"는 것이라 맨 위에 둔다.
    무엇이 이상한지는 코드가 판정하고(아래 '확인된 사실'), AI는 그걸 문장으로 바꿀 뿐이다 —
    AI가 없거나 실패해도 사실 목록은 그대로 보인다.
  -->
  <section class="panel">
    <div class="panel-head">
      <div><p class="eyebrow">어제 요약</p><h2 th:text="${digest.on()}">날짜</h2></div>
      <span class="pill" th:text="${digest.total()} + '건'">0건</span>
    </div>
    <!-- 기록이 없어도 섹션을 숨기지 않는다. 사라지면 기능이 있는지도 모르고,
         무엇보다 "조용함"과 "고장남"이 구분되지 않는다. -->
    <p th:if="${digest.total() == 0}" class="subcopy">
      이 날 기록된 관리 행위가 없습니다.</p>
    <p th:if="${digest.summary() != null}" class="subcopy"
       style="white-space:pre-line" th:text="${digest.summary()}">요약</p>
    <div th:if="${digest.total() > 0}" class="data-table" style="margin-top:.5rem">
      <div class="table-row table-head"><span>확인된 사실</span></div>
      <div class="table-row" th:each="f : ${digest.facts()}">
        <span th:text="${f}">사실</span>
      </div>
    </div>
    <p th:if="${digest.total() > 0}" class="subcopy" style="margin-top:.4rem">
      위 <b>사실</b>은 시스템이 직접 센 값입니다. 요약 문장은 그 사실만 근거로 만들어집니다 —
      사실에 없는 내용은 요약에도 나오지 않습니다.</p>
  </section>
  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">이력</p><h2>관리 행위 기록</h2></div><span class="pill" th:text="${#lists.size(logs)} + '건'">0건</span></div>
    <p th:if="${#lists.isEmpty(logs)}" class="subcopy">기록된 감사 로그가 없습니다.</p>
    <div th:unless="${#lists.isEmpty(logs)}" class="data-table table-scroll">
      <div class="table-row table-head"><span>시각</span><span>행위자</span><span>행위</span><span>대상</span><span>결과</span></div>
      <div class="table-row" th:each="log : ${logs}">
        <span th:text="${log.createdAt}">시각</span>
        <span th:text="${log.actor}">행위자</span>
        <div>
          <strong th:text="${log.action}">ACTION</strong>
          <small th:if="${log.message != null}" th:text="${log.message}" class="t-sub">상세</small>
        </div>
        <span th:text="${log.target}">대상</span>
        <b th:classappend="${log.result.name() == 'SUCCESS'} ? 'good' : 'warn'" th:text="${log.result}">SUCCESS</b>
      </div>
    </div>
  </section>
</main></div>
</body>
</html>
