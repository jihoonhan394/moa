<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${'MOA - ' + pageTitle}">MOA</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar(${page})}"></aside>
  <main class="workspace">
    <header class="topbar">
      <div>
        <p class="eyebrow">보안 / 감사</p>
        <h1 th:text="${pageTitle}">감사 로그</h1>
        <p class="subcopy">서버 접속 요청과 관리자 변경 이력을 감사 관점에서 확인합니다.</p>
      </div>
    </header>
    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">감사 / 이벤트</p>
          <h2>감사 로그</h2>
        </div>
        <span class="pill">데모</span>
      </div>
      <div class="data-table compact">
        <div class="table-row table-head"><span>수행자</span><span>작업 내용</span><span>시간</span></div>
        <div class="table-row"><strong>administrator</strong><span>운영-웹-01 서버 포트 변경</span><span>2026-06-23 09:40</span></div>
        <div class="table-row"><strong>MTCM</strong><span>운영-웹-01 SSH 게이트웨이 접속 요청</span><span>2026-06-23 10:11</span></div>
        <div class="table-row"><strong>김개발</strong><span>업무용 노트북 A 담당자 변경</span><span>2026-06-23 13:24</span></div>
      </div>
      <p class="modal-note">접속 세션 프록시, 자격증명 금고, 파일 전송 대기열은 독립 제품 수준의 보안 설계가 필요해 현재 메뉴에서 제외했습니다.</p>
    </section>
  </main>
</div>
</body>
</html>
