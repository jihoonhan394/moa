<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  폼 상단 오류 요약.

  필드마다 th:errors 를 다는 방식은 반드시 빠뜨린다 — 실제로 폼 29개 중 24개에서 일부 필드가
  표시 자리를 못 받고 있었고, 그 필드에서 검증이 걸리면 화면이 아무 말 없이 되돌아왔다
  (공지 등록에서 pinned 바인딩이 실패했을 때가 그랬다).

  이 조각은 th:object 안에서 쓰며 **그 폼의 모든 오류**를 모아 보여 준다. 새 필드를 추가해도
  따로 손댈 것이 없다.
-->
<div th:fragment="errors" class="form-errors" th:if="${#fields.hasAnyErrors()}" role="alert">
  <p class="form-errors-title">입력을 확인해 주세요</p>
  <ul>
    <li th:each="message : ${#fields.allErrors()}" th:text="${message}">오류</li>
  </ul>
</div>
</body>
</html>
