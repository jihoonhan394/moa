<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  목록의 페이지 이동. 네 화면(감사·자산·사용자·솔루션)이 이 조각 하나를 쓴다.

  같은 마크업을 화면마다 복사하면 반드시 갈라진다 — 이 세션에서 그 실패를 여러 번 봤다.

  인자
    pager : PageView (null 이면 아무 것도 그리지 않는다)

  ⚠️ 링크는 PageView 가 만든다. 템플릿에서 조건을 하나씩 이어 붙이면 화면마다 빠뜨리는
  조건이 생기고, 그러면 2페이지로 가는 순간 검색이 풀린다.
-->
<div th:fragment="pager(pager)" th:if="${pager != null and pager.paged}"
     class="asset-toolbar" style="margin-top:.6rem;align-items:center">
  <a class="button" th:if="${pager.hasPrevious}" th:href="${pager.previousLink}">&larr; 이전</a>
  <span class="subcopy"
        th:text="${pager.displayNumber} + ' / ' + ${pager.totalPages} + ' 페이지 · 전체 ' + ${pager.totalCount} + '건'">
    1 / 1 페이지</span>
  <a class="button" th:if="${pager.hasNext}" th:href="${pager.nextLink}">다음 &rarr;</a>
</div>

</body>
</html>
