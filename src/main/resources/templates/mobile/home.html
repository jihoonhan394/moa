<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mobile/fragments :: head('MOA')}"></head>
<body>
<header th:replace="~{mobile/fragments :: top('MOA', null)}"></header>

<main>
  <!-- 현장에서 가장 많이 누르는 것 하나만 크게. 나머지는 숫자가 붙은 줄로 둔다. -->
  <a class="m-action primary" th:href="@{/m/scan}">
    <span class="icon">&#9635;</span>
    <span>
      <span class="label">자산 스캔</span>
      <span class="sub">QR 을 찍으면 바로 열립니다</span>
    </span>
  </a>

  <ul class="m-list" style="margin-top:8px">
    <li>
      <a class="m-row" th:href="@{/m/notifications}">
        <span class="title">알림</span>
        <span class="meta" th:text="${unreadCount > 0} ? ${unreadCount} + '건 안 읽음' : '새 알림 없음'">-</span>
      </a>
    </li>
    <li>
      <a class="m-row" th:href="@{/m/approvals}">
        <span class="title">승인</span>
        <span class="meta" th:text="${approvalCount > 0} ? ${approvalCount} + '건 대기' : '처리할 것 없음'">-</span>
      </a>
    </li>
    <li>
      <a class="m-row" th:href="@{/m/me}">
        <span class="title">내 것</span>
        <span class="meta" th:text="${myItemCount} + '건 보유 중'">0건</span>
      </a>
    </li>
    <li th:if="${showSolutions}">
      <a class="m-row" th:href="@{/m/solutions}">
        <span class="title">
          솔루션
          <!-- 장애가 있으면 숫자가 아니라 배지로 띄운다. "2건 대기"와 "2건 장애"는
               같은 급으로 읽히면 안 된다. -->
          <span th:if="${downCount > 0}" class="health-badge down"
                th:text="${downCount} + '건 장애'">장애</span>
        </span>
        <span class="meta" th:text="${downCount > 0} ? '눌러서 담당자·업체 연락처' : '담당자·업체 연락처'">담당자·업체 연락처</span>
      </a>
    </li>
  </ul>

  <p class="m-lede" style="margin-top:24px" th:if="${unattachedCount > 0}">
    아직 붙이지 않은 관리번호 스티커가
    <strong th:text="${unattachedCount}">0</strong>장 있습니다.
  </p>
</main>

<nav th:replace="~{mobile/fragments :: tabs('home')}"></nav>
</body>
</html>
