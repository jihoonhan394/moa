<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{mobile/fragments :: head('내 것')}"></head>
<body>
<header th:replace="~{mobile/fragments :: top('내 것', null)}"></header>

<main>
  <a class="m-action" th:href="@{/m/me/requests}">
    <span class="icon">&#9998;</span>
    <span><span class="label">내 요청</span><span class="sub">접근·소모품 요청 상태</span></span>
  </a>
  <a class="m-action" th:href="@{/m/notices}">
    <span class="icon">&#9873;</span>
    <span><span class="label">공지</span><span class="sub">기관 공지사항</span></span>
  </a>

  <p class="m-section">내 자산</p>
  <p class="m-empty" th:if="${#lists.isEmpty(items)}">배정된 자산이 없습니다.</p>

  <ul class="m-list" th:if="${!#lists.isEmpty(items)}">
    <li th:each="item : ${items}">
      <a class="m-row" th:if="${codes.containsKey(item.id)}"
         th:href="@{'/m/t/' + ${codes.get(item.id)}}">
        <span class="title" th:text="${item.name}">자산</span>
        <span class="meta" th:text="${codes.get(item.id)}">MOA-0000-0000</span>
      </a>
      <span class="m-row" th:unless="${codes.containsKey(item.id)}">
        <span class="title" th:text="${item.name}">자산</span>
        <span class="meta">관리번호 없음</span>
      </span>
    </li>
  </ul>
</main>

<nav th:replace="~{mobile/fragments :: tabs('me')}"></nav>
</body>
</html>
