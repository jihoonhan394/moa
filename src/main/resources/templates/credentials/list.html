<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 자격증명</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('credentials')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">서버 관리 / 자격증명</p>
      <h1>자격증명 (볼트)</h1>
      <p class="subcopy">솔루션 제어에 쓸 계정을 암호화 저장합니다. 비밀은 저장 후 다시 표시되지 않습니다(쓰기전용).</p>
    </div>
  </header>

  <div class="content-grid">
    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">새 자격증명</p><h2>등록</h2></div></div>
      <form method="post" th:action="@{/credentials}" th:object="${credentialForm}" class="asset-toolbar">
        <input type="text" th:field="*{name}" maxlength="100" placeholder="이름(예: linux-mtcm)" required>
        <select th:field="*{type}">
          <option th:each="t : ${types}" th:value="${t}" th:text="${t}">PASSWORD</option>
        </select>
        <input type="text" th:field="*{username}" maxlength="255" placeholder="계정" required>
        <input type="text" th:field="*{url}" maxlength="500" placeholder="관리 페이지 주소(선택, 예: 192.168.0.1)">
        <input type="password" th:field="*{secret}" placeholder="비밀(저장 후 미표시)" autocomplete="new-password" required>
        <button class="button primary" type="submit">저장</button>
        <p class="error-message" th:errors="*{name}"></p>
        <p class="error-message" th:errors="*{secret}"></p>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">자격증명</p><h2>목록</h2></div><span class="pill" th:text="${#lists.size(credentials)} + '개'">0개</span></div>
      <p th:if="${#lists.isEmpty(credentials)}" class="subcopy">저장된 자격증명이 없습니다.</p>
      <div th:unless="${#lists.isEmpty(credentials)}" class="data-table compact">
        <div class="table-row table-head"><span>이름</span><span>계정</span><span>바로가기</span><span>공유(열람)</span><span>설정법(위키)</span><span>관리</span></div>
        <div class="table-row" th:each="c : ${credentials}">
          <div>
            <strong th:text="${c.name}">이름</strong>
            <small th:text="${c.type}" style="display:block;color:#7a869a">유형</small>
          </div>
          <span th:text="${c.username}">계정</span>
          <!-- 관리 페이지 바로가기. 스킴은 저장 시 http(s)로 제한된다(javascript: 차단). -->
          <span>
            <a th:if="${c.url != null}" class="button" th:href="${c.url}"
               target="_blank" rel="noopener noreferrer" th:title="${c.url}">열기 ↗</a>
            <span th:if="${c.url == null}" style="color:#7a869a">-</span>
          </span>
          <div>
            <span th:each="uid : ${shares.get(c.id)}" class="pill" style="margin:.1rem" >
              <span th:text="${userNames.get(uid)} ?: '?'">사용자</span>
              <form method="post" th:action="@{'/credentials/' + ${c.id} + '/unshare'}" style="display:inline">
                <input type="hidden" name="userId" th:value="${uid}">
                <button type="submit" title="공유 해제" style="border:none;background:none;cursor:pointer">×</button>
              </form>
            </span>
            <form method="post" th:action="@{'/credentials/' + ${c.id} + '/share'}" style="display:inline">
              <select name="userId" required>
                <option value="">— 공유 대상 —</option>
                <option th:each="u : ${tenantUsers}" th:value="${u.id}" th:text="${u.name}">사용자</option>
              </select>
              <button class="button" type="submit">공유</button>
            </form>
          </div>
          <form method="post" th:action="@{'/credentials/' + ${c.id} + '/wiki'}" style="display:inline">
            <select name="wikiSpaceId" onchange="this.form.submit()">
              <option value="">— 연결 안 함 —</option>
              <option th:each="s : ${spaces}" th:value="${s.id}" th:selected="${s.id == c.wikiSpaceId}" th:text="${s.name}">공간</option>
            </select>
          </form>
          <span class="table-actions">
            <form method="post" th:action="@{'/credentials/' + ${c.id} + '/delete'}" style="display:inline">
              <button class="button" type="submit">삭제</button>
            </form>
          </span>
        </div>
      </div>
    </section>
  </div>
</main></div>
</body>
</html>
