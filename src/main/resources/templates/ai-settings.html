<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - AI 설정')}"></head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('ai-settings')}"></aside><main class="workspace">
  <header class="topbar">
    <div><p class="eyebrow">기관 / AI 설정</p><h1>AI 설정</h1>
      <p class="subcopy">AI 문서 생성 등에 쓸 제공자와 API 키를 등록합니다. 키는 봉투암호화로 안전하게 저장됩니다.</p></div>
  </header>

  <p th:if="${aiMessage}" class="modal-note" th:text="${aiMessage}">결과</p>

  <section class="panel">
    <form method="post" th:action="@{/ai-settings}" th:object="${aiForm}" class="stacked-form" style="display:grid;gap:0.7rem;max-width:620px;">
      <div th:if="${#fields.hasAnyErrors()}" class="error-message"><p th:each="e : ${#fields.allErrors()}" th:text="${e}" style="margin:.1rem 0"></p></div>
      <label>제공자</label>
      <select th:field="*{provider}">
        <option th:each="p : ${providers}" th:value="${p}" th:text="${p.label}">DeepSeek</option>
      </select>

      <label>모델 <small class="t-muted">(비우면 제공자 기본값)</small></label>
      <input type="text" th:field="*{model}" maxlength="100" placeholder="예: deepseek-chat / gpt-4o-mini / claude-3-5-sonnet-latest / gemini-1.5-flash">

      <label>Base URL <small class="t-muted">(비우면 기본값. 폐쇄망 로컬 LLM은 여기에 OpenAI 호환 주소)</small></label>
      <input type="text" th:field="*{baseUrl}" maxlength="255" placeholder="예: https://api.deepseek.com / http://내부LLM:8000">

      <label>API 키</label>
      <input type="password" th:field="*{apiKey}" maxlength="255" autocomplete="new-password"
             th:placeholder="${hasSecret} ? '저장됨 — 변경할 때만 입력' : 'API 키 입력'">
      <p class="subcopy" th:if="${hasSecret}">현재 키가 안전하게 저장되어 있습니다(봉투암호화). 바꿀 때만 입력하세요.</p>

      <label class="checkbox-row"><input type="checkbox" th:field="*{enabled}"> AI 기능 사용(활성화)</label>

      <div><button class="button primary" type="submit">저장</button></div>
    </form>
    <p class="subcopy" style="margin-top:.8rem">기본값 — Gemini: gemini-1.5-flash · Claude: claude-3-5-sonnet-latest · OpenAI: gpt-4o-mini · DeepSeek: deepseek-chat.
      OpenAI·DeepSeek는 OpenAI 호환 방식, Claude·Gemini는 각자 API로 호출합니다.</p>
  </section>
</main></div>
</body>
</html>
