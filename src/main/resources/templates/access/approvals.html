<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 접근 승인</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar(${page})}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">접속 / 접근 승인(JIT)</p>
      <h1>임시 접근 승인</h1>
      <p class="subcopy">내가 담당하는 서버(소유팀 또는 관리 대상)에 대한 접근 요청을 승인·반려합니다.
        승인 시 <b>저장된 볼트 계정</b>을 함께 내주면, 요청자는 비밀번호 없이 접속합니다. 본인 요청은 승인할 수 없습니다.</p>
    </div>
  </header>

  <p th:if="${message}" class="subcopy" style="color:#2d7a3a" th:text="${message}"></p>
  <p th:if="${error}" class="subcopy" style="color:#c0392b" th:text="${error}"></p>

  <!-- 승인 대기 -->
  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">대기</p><h2>승인 대기 요청</h2></div></div>
    <p class="subcopy" th:if="${#lists.isEmpty(pending)}" style="margin:.4rem 0">승인 대기 중인 요청이 없습니다.</p>
    <div th:unless="${#lists.isEmpty(pending)}" class="data-table table-scroll">
      <div class="table-row table-head" style="grid-template-columns:1fr 1.1fr 1.6fr 1.6fr 2fr">
        <span>요청자</span><span>서버</span><span>사유</span><span>기간</span><span>처리</span>
      </div>
      <div class="table-row" th:each="p : ${pending}" style="grid-template-columns:1fr 1.1fr 1.6fr 1.6fr 2fr">
        <strong th:text="${p.requesterName}">요청자</strong>
        <span th:text="${p.assetName}">서버</span>
        <span th:text="${p.reason}">사유</span>
        <span th:text="${p.period}" style="color:#7a869a">기간</span>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap;align-items:center">
          <form method="post" th:action="@{'/access-approvals/' + ${p.id} + '/approve'}"
                style="display:flex;gap:.3rem;align-items:center;flex-wrap:wrap">
            <select name="credentialId" title="함께 내줄 볼트 계정(선택)">
              <option value="">자격증명 없이(요청자가 직접 입력)</option>
              <option th:each="c : ${credentials}" th:value="${c.id}" th:text="${c.label}">계정</option>
            </select>
            <input name="comment" type="text" maxlength="1000" placeholder="코멘트(선택)" style="width:140px">
            <button class="button primary" type="submit">승인</button>
          </form>
          <form method="post" th:action="@{'/access-approvals/' + ${p.id} + '/reject'}" style="display:inline">
            <button class="button" type="submit">반려</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- 유효 승인(회수) -->
  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">유효</p><h2>현재 승인된 접근</h2></div></div>
    <p class="subcopy" th:if="${#lists.isEmpty(grants)}" style="margin:.4rem 0">현재 유효한 임시 접근이 없습니다.</p>
    <div th:unless="${#lists.isEmpty(grants)}" class="data-table table-scroll">
      <div class="table-row table-head" style="grid-template-columns:1fr 1.1fr 1.4fr 1.4fr">
        <span>요청자</span><span>서버</span><span>만료</span><span>처리</span>
      </div>
      <div class="table-row" th:each="g : ${grants}" style="grid-template-columns:1fr 1.1fr 1.4fr 1.4fr">
        <strong th:text="${g.requesterName}">요청자</strong>
        <span th:text="${g.assetName}">서버</span>
        <span th:text="${g.until}" style="color:#7a869a">만료</span>
        <form method="post" th:action="@{'/access-approvals/' + ${g.id} + '/revoke'}" style="display:flex;gap:.3rem"
              onsubmit="return confirm('임시 접근 권한을 회수할까요? 진행 중 세션도 종료 처리됩니다.');">
          <input name="comment" type="text" maxlength="1000" placeholder="회수 사유(선택)" style="width:150px">
          <button class="button" type="submit">회수</button>
        </form>
      </div>
    </div>
  </section>
</main></div>
</body>
</html>
