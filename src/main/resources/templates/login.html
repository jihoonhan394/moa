<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 로그인')}"></head>
<body>
<main class="workspace login-workspace">
  <section class="panel login-panel">
    <p class="eyebrow" th:if="${platform}">플랫폼 운영자</p>
    <p class="eyebrow" th:unless="${platform}"
       th:text="${tenantName} + ' · ' + ${tenantCode}">MTCM · MTCM</p>
    <h1 th:text="${platform} ? '운영자 로그인' : '로그인'">로그인</h1>
    <p class="subcopy" th:if="${platform}">플랫폼(SYSTEM_ADMIN) 계정으로 접속합니다.</p>
    <p class="subcopy" th:unless="${platform}">이 기관의 계정으로 콘솔에 접속하세요.</p>
    <p th:if="${param.error}" class="subcopy t-bad"
       th:text="${platform} ? '아이디 또는 비밀번호가 올바르지 않습니다.' : '이메일 또는 비밀번호가 올바르지 않습니다.'">오류</p>
    <p th:if="${param.logout}" class="subcopy t-good">로그아웃되었습니다.</p>
    <p th:if="${param.joined}" class="subcopy t-good">계정 등록이 완료되었습니다. 이메일과 비밀번호로 로그인하세요.</p>
    <form method="post" th:action="@{/login}">
      <!-- 기관 사용자는 이메일이 로그인 ID(기관 내 유일 키). 플랫폼 운영자만 아이디 로그인. 폼 파라미터명은 username 유지. -->
      <label for="username" th:text="${platform} ? '아이디' : '이메일'">이메일</label>
      <input id="username" name="username" required autofocus
             th:type="${platform} ? 'text' : 'email'"
             th:autocomplete="${platform} ? 'username' : 'email'">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
      <button class="button primary" type="submit">콘솔 로그인</button>
    </form>
    <p class="subcopy login-help" th:unless="${platform}">계정은 기관 관리자의 초대 메일로 발급됩니다.</p>
  </section>
</main>
  <script th:src="@{/js/console-preview.js}" defer></script>
</body>
</html>
