<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 권한이 없습니다</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<!--
  권한 없는 화면에 들어왔을 때. 전에는 Spring 기본 응답이 그대로 나가 JSON 원문
  ({"timestamp":...,"status":403,...})이 보였다 — 무엇이 잘못됐고 어디로 가야 하는지
  알 수 없는 화면이다.
-->
<main class="workspace login-workspace">
  <section class="panel login-panel empty-state">
    <p class="eyebrow">권한 없음</p>
    <h1>이 화면을 볼 권한이 없습니다</h1>
    <p class="subcopy">담당 역할에게만 열려 있는 기능입니다.
      필요하시면 기관 관리자에게 권한을 요청하세요.</p>
    <p class="subcopy">주소를 직접 입력하셨다면 메뉴에서 다시 찾아 주세요 —
      <b>메뉴에 보이는 것이 곧 열 수 있는 것</b>입니다.</p>
    <a class="button primary" href="/">처음 화면으로</a>
  </section>
</main>
</body>
</html>
