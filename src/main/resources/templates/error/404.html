<!DOCTYPE html>
<html lang="ko">
<head th:replace="~{fragments/head :: head('MOA - 찾을 수 없습니다')}"></head>
<body>
<!--
  없는 자원이거나 볼 권한이 없는 자원. 교차 기관 접근은 대상의 존재 여부조차 알리지
  않으려고 403이 아니라 404로 응답하므로(GlobalExceptionHandler), 문구도 둘을 구분하지 않는다.
-->
<main class="workspace login-workspace">
  <section class="panel login-panel empty-state">
    <p class="eyebrow">찾을 수 없음</p>
    <h1>요청하신 항목이 없습니다</h1>
    <p class="subcopy">이미 삭제됐거나, 접근할 수 없는 항목입니다.
      목록에서 다시 선택해 주세요.</p>
    <a class="button primary" href="/">처음 화면으로</a>
  </section>
</main>
</body>
</html>
