<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 위키 이력')}"></head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('wiki')}"></aside><main class="workspace">
  <header class="topbar">
    <div><p class="eyebrow"><a th:href="@{/wiki}">위키</a> / <a th:href="@{'/wiki/' + ${wikiPage.id}}" th:text="${wikiPage.title}">문서</a> / 이력</p>
      <h1>수정 이력</h1></div>
  </header>
  <section class="panel">
    <p th:if="${#lists.isEmpty(revisions)}" class="subcopy">이전 버전이 없습니다(아직 수정 이력 없음).</p>
    <div th:unless="${#lists.isEmpty(revisions)}" class="data-table">
      <div class="table-row table-head"><span>시각</span><span>제목</span><span>수정자</span><span>관리</span></div>
      <div class="table-row" th:each="r : ${revisions}">
        <span th:text="${#temporals.format(r.at, 'yyyy-MM-dd HH:mm')}">시각</span>
        <span th:text="${r.title}">제목</span>
        <span th:text="${r.editor}">수정자</span>
        <span class="table-actions">
          <a class="button" th:href="@{'/wiki/' + ${wikiPage.id} + '/history/' + ${r.revId}}">보기</a>
          <form class="inline" th:if="${canEdit}" method="post" th:action="@{'/wiki/' + ${wikiPage.id} + '/history/' + ${r.revId} + '/restore'}"
                onsubmit="return confirm('이 버전으로 되돌릴까요? 현재 내용도 이력으로 남습니다.')">
            <button class="button" type="submit">되돌리기</button>
          </form>
        </span>
      </div>
    </div>
  </section>
</main></div>
</body>
</html>
