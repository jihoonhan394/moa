<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 사용자 관리')}"></head>
<body>
<div class="app-shell">
  <aside th:replace="~{fragments/sidebar :: sidebar('users')}"></aside>
  <main class="workspace">
    <header class="topbar">
      <div><p class="eyebrow">관리자 / 사용자 관리</p><h1>사용자 관리</h1><p class="subcopy">테넌트 사용자 계정을 관리합니다.</p></div>
      <a class="button primary" th:href="@{/users/new}">사용자 등록</a>
    </header>
    <p th:if="${userMessage}" class="modal-note" th:text="${userMessage}">결과</p>
    <p th:if="${userError}" class="modal-note t-bad" th:text="${userError}">오류</p>
    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">사용자 목록</p><h2>등록된 사용자</h2></div><span class="pill" th:text="${#lists.size(users)} + '명'">0명</span></div>
      <!-- 검색·필터. 사람이 30명을 넘으면 목록에서 눈으로 찾는 것이 가장 느리다.
           거르기는 DB 가 한다(ManagedUserRepository.filter). -->
      <form method="get" th:action="@{/users}" class="asset-toolbar" style="margin-bottom:.6rem">
        <input type="search" name="q" th:value="${q}" placeholder="이름 · 아이디 · 이메일 검색"
               aria-label="사용자 검색" style="min-width:16rem">
        <select name="status" aria-label="상태">
          <option value="">상태 전체</option>
          <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.label}"
                  th:selected="${st == status}">재직</option>
        </select>
        <select name="role" aria-label="역할">
          <option value="">역할 전체</option>
          <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"
                  th:selected="${r == role}">역할</option>
        </select>
        <button class="button primary" type="submit">찾기</button>
        <a th:if="${q != null or status != null or role != null}" class="small-link"
           th:href="@{/users}">조건 지우기</a>
      </form>
      <p th:if="${#lists.isEmpty(users) and q == null and status == null and role == null}"
         class="subcopy">등록된 사용자가 없습니다. 우측 상단에서 사용자를 등록하세요.</p>
      <p th:if="${#lists.isEmpty(users) and (q != null or status != null or role != null)}"
         class="subcopy">조건에 맞는 사용자가 없습니다. <strong>조건 지우기</strong>를 눌러 보세요.</p>
      <div th:unless="${#lists.isEmpty(users)}" class="data-table user-table table-scroll">
        <div class="table-row table-head"><span>이름</span><span>아이디</span><span>이메일</span><span>상태</span><span>관리</span></div>
        <div class="table-row" th:each="user : ${users}">
          <div>
            <strong th:text="${user.name}">이름</strong>
            <small th:text="${user.roleSummary}" class="t-sub">일반 사용자</small>
          </div>
          <span th:text="${user.username}">아이디</span>
          <span th:text="${user.email != null ? user.email : '-'}">이메일</span>
          <b th:classappend="${user.status.name() == 'ACTIVE'} ? 'good' : (${user.status.name() == 'OFFBOARDED'} ? 'bad' : 'warn')"
             th:text="${user.status.label}">활성</b>
          <span class="table-actions">
            <!-- 퇴사(종료)는 되돌릴 수 없으므로 관리 액션을 노출하지 않는다. -->
            <!-- 퇴사자일수록 보유 자산을 봐야 한다. 자산 화면은 자산 권한이라 겸직자에게만 보인다. -->
            <a th:if="${isAssetManager}" class="button" th:href="@{'/inventory/by-user/' + ${user.id}}">보유 자산</a>
            <span th:if="${user.status.name() == 'OFFBOARDED'}" class="subcopy no-margin">퇴사 처리됨</span>
            <th:block th:unless="${user.status.name() == 'OFFBOARDED'}">
              <form class="inline" th:if="${user.status.name() == 'PENDING'}" method="post" th:action="@{'/users/' + ${user.id} + '/approve'}">
                <button class="button primary" type="submit">승인</button>
              </form>
              <a class="button" th:href="@{'/users/' + ${user.id} + '/edit'}">수정</a>
              <form class="inline" th:if="${user.status.name() == 'ACTIVE'}" method="post" th:action="@{'/users/' + ${user.id} + '/disable'}">
                <button class="button" type="submit">비활성</button>
              </form>
              <form class="inline" th:if="${user.status.name() == 'DISABLED'}" method="post" th:action="@{'/users/' + ${user.id} + '/activate'}">
                <button class="button" type="submit">활성</button>
              </form>
              <form class="inline" th:if="${user.status.name() == 'ACTIVE' or user.status.name() == 'DISABLED'}" method="post" th:action="@{'/users/' + ${user.id} + '/offboard'}"
                    onsubmit="return confirm('퇴사 처리하면 이 사용자의 모든 접근(그룹·권한·솔루션)이 회수되고 되돌릴 수 없습니다. 진행할까요?')">
                <button class="button t-bad" type="submit">퇴사</button>
              </form>
            </th:block>
          </span>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>
