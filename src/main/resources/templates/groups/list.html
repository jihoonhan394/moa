<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 그룹/권한 관리</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('groups')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">관리자 / 그룹·권한 관리</p>
      <h1>그룹 관리</h1>
      <p class="subcopy">그룹을 만들고 사용자 배정과 자산 접근 권한을 부여합니다.</p>
    </div>
  </header>

  <p th:if="${moveError != null}" class="subcopy t-bad" th:text="${moveError}">이동 오류</p>
  <p th:if="${groupError != null}" class="subcopy t-bad" th:text="${groupError}">오류</p>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">새 그룹/부서</p><h2>그룹(부서) 추가</h2></div></div>
    <form method="post" th:action="@{/groups}" th:object="${groupForm}"
          style="display:flex;flex-wrap:wrap;gap:.75rem;align-items:flex-end">
      <label style="display:flex;flex-direction:column;gap:.25rem">
        <span class="subcopy" style="margin:0"><b>① 상위 부서</b> (어디 밑에?)</span>
        <select th:field="*{parentId}" style="min-width:180px">
          <option th:value="${null}">— 최상위 (독립 부서) —</option>
          <option th:each="p : ${parentOptions}" th:value="${p.id}" th:text="${p.name}">상위</option>
        </select>
      </label>
      <label style="display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:180px">
        <span class="subcopy" style="margin:0"><b>② 부서 이름</b></span>
        <input type="text" th:field="*{name}" placeholder="예: 영업팀" required>
      </label>
      <label style="display:flex;flex-direction:column;gap:.25rem;flex:1;min-width:150px">
        <span class="subcopy" style="margin:0">설명 (선택)</span>
        <input type="text" th:field="*{description}" placeholder="예: 국내 영업">
      </label>
      <button class="button primary" type="submit" style="height:fit-content">추가</button>
      <p class="subcopy t-bad" th:if="${#fields.hasErrors('name')}" th:errors="*{name}" style="flex-basis:100%">이름 오류</p>
    </form>
    <p class="subcopy" style="margin-top:.6rem">💡 <b>상위 부서</b>를 '최상위'로 두면 독립 부서, 특정 부서를 고르면 <b>그 아래 하위 조직</b>으로 생깁니다. (또는 부서 상세에서 '하위 그룹 추가')</p>
  </section>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">조직도</p><h2>그룹 트리</h2></div><span class="pill" th:text="${#lists.size(tree)} + '개'">0개</span></div>
    <p th:if="${#lists.isEmpty(tree)}" class="subcopy">등록된 그룹이 없습니다. 위에서 새 그룹을 생성하세요.</p>
    <div th:unless="${#lists.isEmpty(tree)}" class="data-table compact">
      <div class="table-row table-head"><span>조직 (트리)</span><span>인원</span><span>상태</span><span>관리</span></div>
      <div class="table-row" th:each="node : ${tree}">
        <div th:style="'padding-left:' + ${node.depth * 22} + 'px'">
          <span th:if="${node.depth > 0}" style="color:var(--muted)">└&nbsp;</span>
          <strong><a th:href="@{'/groups/' + ${node.group.id}}" th:text="${node.group.name}">그룹명</a></strong>
          <span th:if="${node.hasChildren}" class="pill" style="margin-left:.35rem" title="하위 조직 있음">▾ 하위</span>
          <small th:if="${node.group.description != null}" th:text="${node.group.description}" class="t-sub">설명</small>
        </div>
        <span th:text="${node.memberCount} + '명'">0명</span>
        <span>
          <span class="state" th:classappend="${node.group.status.name() == 'ACTIVE'} ? 'online' : 'offline'"></span>
          <span th:text="${node.group.status}">ACTIVE</span>
        </span>
        <span class="table-actions">
          <details style="display:inline-block">
            <summary class="button primary" style="list-style:none;cursor:pointer" title="이 부서 아래에 하위 부서 만들기">+ 하위</summary>
            <form method="post" th:action="@{/groups}" style="margin-top:.4rem;display:flex;gap:.3rem">
              <input type="hidden" name="parentId" th:value="${node.group.id}">
              <input type="text" name="name" placeholder="하위 부서명 (예: 영업1팀)" required style="min-width:150px">
              <button class="button" type="submit">추가</button>
            </form>
          </details>
          <a class="button" th:href="@{'/groups/' + ${node.group.id}}">상세</a>
          <form method="post" th:action="@{'/groups/' + ${node.group.id} + '/move'}" style="display:inline">
            <select name="parentId" aria-label="상위 이동" onchange="this.form.submit()">
              <option value="">최상위로</option>
              <option th:each="p : ${parentOptions}" th:if="${p.id != node.group.id}"
                      th:value="${p.id}" th:selected="${p.id == node.group.parentId}" th:text="'→ ' + ${p.name}">상위</option>
            </select>
          </form>
          <form th:if="${node.group.status.name() == 'ACTIVE'}" method="post" th:action="@{'/groups/' + ${node.group.id} + '/disable'}" style="display:inline">
            <button class="button" type="submit">비활성</button>
          </form>
          <form method="post" th:action="@{'/groups/' + ${node.group.id} + '/delete'}" style="display:inline"
                th:attr="onsubmit=|return confirm('&quot;${node.group.name}&quot; 부서를 삭제할까요? 하위 그룹은 상위로 올라가고 멤버 배정은 해제됩니다.')|">
            <button class="button danger" type="submit">삭제</button>
          </form>
        </span>
      </div>
    </div>
  </section>
</main></div>
</body>
</html>
