<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 기관 관리')}"></head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('tenants')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">플랫폼 / 기관 관리</p>
      <h1>기관(테넌시) 관리</h1>
      <p class="subcopy">기관을 등록하고, 상세에서 구독 기간·사용 기능·대표 관리자를 설정합니다.</p>
    </div>
  </header>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">새 기관</p><h2>기관 등록</h2></div></div>
    <form method="post" th:action="@{/admin/tenants}" th:object="${tenantForm}" class="asset-toolbar">
    <div th:replace="~{fragments/form-errors :: errors}"></div>
      <input type="text" th:field="*{name}" placeholder="기관명 (예: 카카오)" required>
      <input type="text" th:field="*{code}" placeholder="기관 코드 (예: KAKAO)" required style="text-transform:uppercase">
      <button class="button primary" type="submit">기관 등록</button>
      <p class="subcopy t-bad" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">이름 오류</p>
      <p class="subcopy t-bad" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">코드 오류</p>
    </form>
    <p class="subcopy">
      기관 코드는 사용자가 <strong>로그인 1단계에서 직접 입력</strong>합니다 — 짧고 외우기 쉬운 영문으로.
      <br>
      <strong>기능 모듈은 전부 켜진 상태로 생성됩니다.</strong> 안 산 기능은 기관 상세에서 내리세요.
    </p>
  </section>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">기관 목록</p><h2>등록된 기관</h2></div><span class="pill" th:text="${#lists.size(tenants)} + '개'">0개</span></div>
    <p th:if="${#lists.isEmpty(tenants)}" class="subcopy">등록된 기관이 없습니다. 위에서 새 기관을 등록하세요.</p>
    <div th:unless="${#lists.isEmpty(tenants)}" class="data-table compact">
      <div class="table-row table-head"><span>기관</span><span>상태</span><span>관리</span></div>
      <div class="table-row" th:each="tenant : ${tenants}">
        <div>
          <strong><a th:href="@{'/admin/tenants/' + ${tenant.id}}" th:text="${tenant.code}">MTCM</a></strong>
          <small th:text="${tenant.name}" class="t-sub">기관명</small>
        </div>
        <span>
          <span class="state" th:classappend="${tenant.status.name() == 'ACTIVE'} ? 'online' : 'offline'"></span>
          <span th:text="${tenant.status}">ACTIVE</span>
          <span th:if="${tenant.isExpired(today)}" style="color:var(--red);font-weight:600"> · 만료</span>
          <span th:if="${tenant.isExpiringSoon(today)}" style="color:var(--warn);font-weight:600"
                th:text="' · 만기임박(' + ${tenant.subscriptionEnd} + ')'"> · 만기임박</span>
        </span>
        <span class="table-actions">
          <a class="button" th:href="@{'/admin/tenants/' + ${tenant.id}}">상세 · 설정</a>
        </span>
      </div>
    </div>
  </section>
</main></div>
</body>
</html>
