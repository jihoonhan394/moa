<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('MOA - 기관 상세')}"></head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('tenants')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">플랫폼 / 기관 상세</p>
      <h1><span th:text="${tenant.code}">CODE</span> · <span th:text="${tenant.name}">기관명</span></h1>
      <p class="subcopy">구독 기간과 사용 가능한 기능, 대표 관리자를 설정합니다.</p>
    </div>
    <div class="top-actions"><a class="button" th:href="@{/admin/tenants}">← 기관 목록</a></div>
  </header>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">상태</p><h2>기관 정보</h2></div>
      <form th:if="${tenant.status.name() == 'ACTIVE'}" method="post" th:action="@{'/admin/tenants/' + ${tenant.id} + '/disable'}" style="margin:0"><button class="button" type="submit">비활성</button></form>
      <form th:unless="${tenant.status.name() == 'ACTIVE'}" method="post" th:action="@{'/admin/tenants/' + ${tenant.id} + '/enable'}" style="margin:0"><button class="button" type="submit">재활성</button></form>
    </div>
    <dl class="detail-list">
      <div><dt>상태</dt><dd><span class="state" th:classappend="${tenant.isAccessible(today)} ? 'online' : 'offline'"></span>
        <span th:text="${tenant.status}">ACTIVE</span>
        <span th:if="${tenant.isExpired(today)}" class="t-bad"> · 구독 만료</span></dd></div>
      <div><dt>사용자 수</dt><dd th:text="${userTotal}">0</dd></div>
      <div><dt>생성일</dt><dd th:text="${tenant.createdAt}">-</dd></div>
    </dl>
  </section>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">구독 · 기능</p><h2>사용기간과 사용 가능한 기능</h2></div></div>
    <form method="post" th:action="@{'/admin/tenants/' + ${tenant.id}}">
      <div style="display:flex;gap:1.2rem;flex-wrap:wrap;align-items:end;margin-bottom:1rem">
        <label>구독 시작일<br><input type="date" id="subStart" name="subscriptionStart" th:value="${tenant.subscriptionStart}"></label>
        <label>구독 만기일<br><input type="date" id="subEnd" name="subscriptionEnd" th:value="${tenant.subscriptionEnd}"></label>
        <label style="display:flex;align-items:center;gap:0.4rem;padding-bottom:0.5rem">
          <input type="checkbox" id="unlimited" name="unlimited" th:checked="${tenant.subscriptionEnd == null}">무제한(기간 없음)
        </label>
      </div>
      <script>
        (function () {
          var chk = document.getElementById('unlimited');
          var dates = [document.getElementById('subStart'), document.getElementById('subEnd')];
          function sync() {
            dates.forEach(function (d) { d.disabled = chk.checked; if (chk.checked) { d.value = ''; } });
          }
          chk.addEventListener('change', sync);
          sync();
        })();
      </script>
      <p class="eyebrow">사용 가능한 기능</p>
      <div style="display:flex;gap:1.2rem;flex-wrap:wrap;margin:0.5rem 0 1rem">
        <label th:each="feature : ${allFeatures}" style="display:flex;align-items:center;gap:0.4rem">
          <input type="checkbox" name="features" th:value="${feature}" th:checked="${tenant.hasFeature(feature)}">
          <span th:text="${feature.label}">기능</span>
        </label>
      </div>
      <button class="button primary" type="submit">저장</button>
    </form>
  </section>

  <section class="panel">
    <div class="panel-head"><div><p class="eyebrow">대표 관리자</p><h2>기관 운영자(TENANT_ADMIN)</h2></div><span class="pill" th:text="${#lists.size(tenantAdmins)} + '명'">0명</span></div>
    <p th:if="${adminError}" th:text="${adminError}" class="subcopy t-bad">오류</p>
    <div th:if="${!#lists.isEmpty(tenantAdmins)}" class="data-table compact" style="margin-bottom:1rem">
      <div class="table-row table-head"><span>관리자</span><span>상태</span><span></span></div>
      <div class="table-row" th:each="admin : ${tenantAdmins}">
        <div><strong th:text="${admin.username}">아이디</strong><small th:text="${admin.name}" class="t-sub">이름</small></div>
        <span><span class="state" th:classappend="${admin.status.name() == 'ACTIVE'} ? 'online' : 'offline'"></span><span th:text="${admin.status}">ACTIVE</span></span>
        <span class="row-actions" style="display:flex;gap:0.4rem;flex-wrap:wrap;align-items:start">
          <form th:if="${admin.status.name() == 'ACTIVE'}" method="post"
                th:action="@{'/admin/tenants/' + ${tenant.id} + '/admins/' + ${admin.id} + '/disable'}" style="margin:0">
            <button class="button" type="submit">비활성</button></form>
          <form th:unless="${admin.status.name() == 'ACTIVE'}" method="post"
                th:action="@{'/admin/tenants/' + ${tenant.id} + '/admins/' + ${admin.id} + '/enable'}" style="margin:0">
            <button class="button" type="submit">활성</button></form>
          <details style="margin:0">
            <summary class="button" style="list-style:none;cursor:pointer">수정</summary>
            <form method="post" th:action="@{'/admin/tenants/' + ${tenant.id} + '/admins/' + ${admin.id} + '/update'}"
                  style="margin-top:0.5rem;display:flex;flex-direction:column;gap:0.4rem;min-width:220px">
              <input type="text" name="name" th:value="${admin.name}" placeholder="이름" required>
              <input type="email" name="email" th:value="${admin.email}" placeholder="이메일" required autocomplete="off">
              <input type="text" name="phone" th:value="${admin.phoneDisplay}" placeholder="전화번호" required>
              <input type="password" name="password" placeholder="비밀번호 재설정(선택, 8자 이상)" autocomplete="new-password">
              <input type="password" name="passwordConfirm" placeholder="비밀번호 확인(변경 시)" autocomplete="new-password">
              <button class="button primary" type="submit">저장</button>
            </form>
          </details>
          <form method="post" th:action="@{'/admin/tenants/' + ${tenant.id} + '/admins/' + ${admin.id} + '/delete'}"
                style="margin:0" onsubmit="return confirm('이 관리자를 삭제할까요? 활동 이력이 있으면 삭제 대신 비활성을 사용하세요.')">
            <button class="button t-bad" type="submit">삭제</button></form>
        </span>
      </div>
    </div>
    <form method="post" th:action="@{'/admin/tenants/' + ${tenant.id} + '/admins'}" class="asset-toolbar">
      <input type="text" name="username" placeholder="아이디" required autocomplete="off">
      <input type="text" name="name" placeholder="이름" required>
      <input type="email" name="email" placeholder="이메일" required autocomplete="off">
      <input type="text" name="phone" placeholder="전화번호" required>
      <input type="password" name="password" placeholder="비밀번호 (8자 이상)" required autocomplete="new-password">
      <input type="password" name="passwordConfirm" placeholder="비밀번호 확인" required autocomplete="new-password">
      <button class="button primary" type="submit">대표 관리자 생성</button>
    </form>
    <p class="subcopy">이 기관 코드(<b th:text="${tenant.code}">CODE</b>)로 진입해 로그인합니다.</p>
  </section>
</main></div>
</body>
</html>
