<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOA - 시스템 상태</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="app-shell"><aside th:replace="~{fragments/sidebar :: sidebar('platform-system')}"></aside><main class="workspace">
  <header class="topbar">
    <div>
      <p class="eyebrow">플랫폼 / 시스템 상태</p>
      <h1>시스템 상태</h1>
      <p class="subcopy">플랫폼 서비스와 데이터베이스 상태를 확인합니다.</p>
    </div>
  </header>

  <div class="overview-grid">
    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">상태</p><h2>서비스 · DB</h2></div></div>
      <dl class="detail-list">
        <div><dt>데이터베이스</dt><dd><span class="state" th:classappend="${dbOk} ? 'online' : 'offline'"></span><span th:text="${dbOk} ? '정상' : '연결 불가'">정상</span></dd></div>
        <div><dt>스키마 버전(Flyway)</dt><dd th:text="${schemaVersion}">V16</dd></div>
      </dl>
    </section>
    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">집계</p><h2>플랫폼 규모</h2></div></div>
      <dl class="detail-list">
        <div><dt>전체 기관</dt><dd th:text="${tenantTotal}">0</dd></div>
        <div><dt>전체 사용자</dt><dd th:text="${userTotal}">0</dd></div>
        <div><dt>전체 자산</dt><dd th:text="${assetTotal}">0</dd></div>
      </dl>
    </section>
  </div>
</main></div>
</body>
</html>
