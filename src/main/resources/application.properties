spring.application.name=moa
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://100.119.51.84:5432/db_moa}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:moa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 세션 쿠키. HTTPS 뒤에 두면 MOA_COOKIE_SECURE=true 로 켠다 — 켜면 평문 연결에는 쿠키가
# 아예 실리지 않으므로 로컬(평문 8081)에서는 꺼 둔 채로 쓴다.
# http-only 는 Spring 기본값이 true 지만, 보이게 적어 둔다(스크립트가 쿠키를 못 읽게).
server.servlet.session.cookie.secure=${MOA_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# 로그인 세션 유휴 타임아웃(무활동 시 만료). 비활성화 직전 세션 잔여 리스크를 짧은 유휴 만료로 완화(권한정책서).
server.servlet.session.timeout=30m
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# 자격증명 볼트 KEK(마스터 키). 64 hex = 32바이트(AES-256). 운영은 반드시 env로 주입, 코드/문서에 실제값 금지.
moa.vault.master-key=${MOA_VAULT_MASTER_KEY:}
# 데모 데이터는 기본으로 끈다. 켜면 빈 DB에 가짜 서버·사용자를 만들고 dev.kim에게 관리
# 역할 셋을 모두 부여한다 — 시연에는 필요하지만, 실제 기관의 첫 화면에 남의 자산(내부
# 테스트 장비 IP까지)이 보이면 안 된다. 로컬·데모는 프로파일에서 켠다.
# 리버스 프록시 신뢰 홉 수. 로그인 잠금과 감사 기록의 출발지가 여기서 정해진다.
#   0  X-Forwarded-For 를 아예 믿지 않고 TCP 연결 상대 주소만 쓴다 (기본값)
#   1  앞단에 nginx 한 대
#   2  CDN/WAF 가 한 겹 더
# ⚠️ 기본값이 0 인 이유: 설정하지 않은 환경이 안전한 쪽으로 떨어져야 한다. 헤더를 그대로 믿으면
#    출발지 잠금을 우회할 수 있고 감사 기록에 남의 IP 를 적을 수 있다(ClientIpResolver 참고).
moa.trusted-proxy-count=${MOA_TRUSTED_PROXY_COUNT:0}

moa.sample-data.enabled=${MOA_SAMPLE_DATA_ENABLED:false}
server.error.include-message=never
server.error.include-stacktrace=never

# ── 애플리케이션 튜닝값(하드코딩 대신 설정으로) ─────────────────────────────
# 대시보드 '최근 접속' 표시 개수
moa.dashboard.recent-limit=6
# 기동 순서: 단계별 시작 후 최대 대기(초), 스케줄러 cron 평가 주기(ms)
moa.sequence.max-wait-seconds=120
moa.sequence.scheduler-interval-ms=60000
# AI 제공자 호출 타임아웃(초)
moa.ai.connect-timeout-seconds=10
moa.ai.request-timeout-seconds=60
# 위키 첨부 저장 루트(기관별 하위 디렉터리로 격리). 운영에선 영속 볼륨 경로로 지정.
# 실제 파일은 <루트>/<기관ID>/<yyyy-MM>/<2자>/<첨부ID> 로 흩어 담는다 — 한 디렉터리에 파일이
# 무한정 쌓이면 백업·동기화가 파일 수에 비례해 느려지기 때문. 경로는 행마다 DB에 남으므로
# 레이아웃이 바뀌어도 기존 파일은 그대로 열린다.
moa.wiki.attachment-dir=data/wiki-attachments
# 기관별 첨부 총량 상한(MB). 0 이하면 무제한. 개별 파일 한도는 아래 multipart 설정.
moa.wiki.attachment-quota-mb=2048
# 위키 첨부 업로드 한도
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# ⚠️ 컨테이너가 X-Forwarded-* 를 스스로 적용하지 못하게 한다. 기본값은 none 이다.
#
# framework 로 두면 ForwardedHeaderFilter 가 getRemoteAddr() 를 헤더 값으로 바꾸고 **헤더를
# 지워 버린다.** 그러면 moa.trusted-proxy-count 가 무의미해지고(리졸버가 볼 헤더가 없다)
# 클라이언트가 보낸 값이 그대로 출발지가 되어 **출발지 잠금 우회와 감사 기록 오염**이 가능하다.
# 실제로 count=0 인데 remoteAddr 이 위조값으로 찍히는 것을 확인했다.
#
# 출발지 판정은 ClientIpResolver 한 곳에서만 한다(moa.trusted-proxy-count).
# 절대 URL(초대 링크 등)은 아래 moa.base-url 로 푼다 — 프록시 뒤에서는 그쪽이 더 확실하다.
server.forward-headers-strategy=${MOA_FORWARD_HEADERS_STRATEGY:none}
# 초대 링크 등 절대 URL의 기준. **프록시 뒤에 두면 반드시 공개 주소를 넣는다.**
# 비우면 요청에서 유도하는데, 위 설정이 none 이면 그 값은 내부 주소다.
moa.base-url=${MOA_BASE_URL:}

# ── 로그 잡음 억제 ─────────────────────────────
# 커스텀 AuthenticationProvider(TenantAuthenticationProvider)를 쓰면 스프링이 UserDetailsService가
# 무시된다는 양성 WARN을 남긴다. 의도된 구성이므로 스프링 권장대로 해당 로거만 ERROR로 올려 억제한다.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
