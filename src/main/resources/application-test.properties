spring.datasource.url=jdbc:h2:mem:moa;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# 테스트용 볼트 마스터 키(64 hex = 32바이트). 실제 비밀 아님.
moa.vault.master-key=00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
# 위키 첨부는 build/ 아래 임시 경로에 저장(작업 디렉터리 오염 방지, 빌드 클린 시 정리).
moa.wiki.attachment-dir=build/test-wiki-attachments

# 현재 테스트들은 시드된 기본 기관(사용자·그룹·자산)을 전제로 쓰였다. 기본값이 off로
# 바뀌었으므로 테스트 프로파일에서 명시적으로 켠다 — 의존이 드러나 있는 편이 낫다.
moa.sample-data.enabled=true

# 헬스 체크 배치는 테스트에서 끈다. 1분 주기로 켜 두면 테스트가 돌아가는 사이 배치가
# 시드된 자산의 호스트(실재하지 않는다)로 TCP 접속을 시도해 느려지고, 테스트가 만든
# 솔루션의 상태를 배치가 덮어써 결과가 실행 순서에 따라 흔들린다.
# 헬스 체크 자체는 SolutionHealthService 를 직접 불러 검증한다.
moa.solution.health-enabled=false
